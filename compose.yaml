services:
  nightlock_mysql:
    image: mysql:8.0
    container_name: nightlock_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nightlock_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nightlock_db}
      MYSQL_USER: ${MYSQL_USER:-nightlock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nightlock_pass}
    ports:
      - "3306:3306"
    volumes:
      - nightlock_db_data:/var/lib/mysql
    networks:
      - nightlock_network

  nightlock_phpmyadmin:
    image: phpmyadmin
    container_name: nightlock_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: nightlock_mysql
    ports:
      - "8080:80"
    networks:
      - nightlock_network

volumes:
  nightlock_db_data:
    name: nightlock_db_data

networks:
  nightlock_network:
    name: nightlock_network
